<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Codes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 1.5rem;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    button:hover {
      background: #2a2a2a;
      border-color: #555;
    }

    button:active {
      transform: scale(0.98);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
    }

    #qrcode {
      margin-bottom: 1.5rem;
    }

    #qrcode img {
      border-radius: 8px;
      max-width: 280px;
    }

    .close-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .close-btn:hover {
      background: #444;
    }

    .verify-modal h2 {
      margin-bottom: 1.5rem;
      font-weight: 300;
    }

    .verify-input {
      background: #0f0f0f;
      border: 1px solid #333;
      color: #fff;
      padding: 1rem;
      font-size: 1.2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .verify-input:focus {
      outline: none;
      border-color: #555;
    }

    .verify-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      width: 100%;
      max-width: 280px;
    }

    .verify-btn:hover {
      background: #444;
    }

    .error-msg {
      color: #ff6b6b;
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="modal verify-modal active" id="verifyModal">
    <div class="modal-content">
      <h2>Damian is?</h2>
      <input type="password" class="verify-input" id="verifyInput" placeholder="Password">
      <button class="verify-btn" onclick="verify()">Enter</button>
      <p class="error-msg" id="errorMsg">Incorrect password</p>
    </div>
  </div>

  <div class="container hidden" id="mainContent">
    <h1>QR CODES</h1>
    <div class="buttons">
      <button onclick="showQR('01')">01</button>
      <button onclick="showQR('02')">02</button>
      <button onclick="showQR('03')">03</button>
      <button onclick="showQR('04')">04</button>
      <button onclick="showQR('05')">05</button>
      <button onclick="showQR('51')">51</button>
      <button onclick="showQR('52')">52</button>
      <button onclick="showQR('53')">53</button>
      <button onclick="showQR('54')">54</button>
      <button onclick="showQR('55')">55</button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div id="qrcode"></div>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    function verify() {
      const input = document.getElementById('verifyInput').value.toLowerCase();
      if (input === 'handsome') {
        document.getElementById('verifyModal').classList.remove('active');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('verifyInput').value = '';
        document.getElementById('errorMsg').style.display = 'none';
        
        if (pendingQR !== null) {
          const id = pendingQR;
          pendingQR = null;
          showQR(id);
        }
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('verifyInput').value = '';
      }
    }

    document.getElementById('verifyInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') verify();
    });

    let pendingQR = null;

    function showQR(id) {
      const mainContent = document.getElementById('mainContent');
      if (mainContent.classList.contains('hidden')) {
        pendingQR = id;
        document.getElementById('verifyModal').classList.add('active');
        return;
      }
      
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '<img src="qr_images/' + id + '.png" alt="QR Code ' + id + '">';
      
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      if (pendingQR !== null) {
        pendingQR = null;
      }
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>
</html>
