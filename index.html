<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Codes</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 1.5rem;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    button:hover {
      background: #2a2a2a;
      border-color: #555;
    }

    button:active {
      transform: scale(0.98);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1a1a1a;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
    }

    #qrcode {
      margin-bottom: 1.5rem;
    }

    #qrcode canvas {
      border-radius: 8px;
    }

    .close-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .close-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR CODES</h1>
    <div class="buttons">
      <button onclick="showQR(0)">01</button>
      <button onclick="showQR(1)">02</button>
      <button onclick="showQR(2)">03</button>
      <button onclick="showQR(3)">04</button>
      <button onclick="showQR(4)">05</button>
      <button onclick="showQR(5)">51</button>
      <button onclick="showQR(6)">52</button>
      <button onclick="showQR(7)">53</button>
      <button onclick="showQR(8)">54</button>
      <button onclick="showQR(9)">55</button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div id="qrcode"></div>
      <button class="close-btn" onclick="closeModal()">Close</button>

  </div>

    function showQR(index) {
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      
      const qr = qrcode(0, 'M');
      qr.addData(codes[index]);
      qr.make();
      
      qrContainer.innerHTML = qr.createSvgTag(8, 0);
      
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
